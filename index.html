<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ValoTakas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0f1923;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Inter', sans-serif;
        }
        .container {
            width: 100%;
            max-width: 620px;
            background: #1a2a3a;
            border-radius: 32px;
            padding: 36px 32px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 70, 85, 0.12);
        }
        .login-box {
            background: linear-gradient(145deg, #ffffff, #f5f7fa);
            border-radius: 24px;
            padding: 48px 40px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .login-box .logo-icon {
            font-size: 56px;
            color: #ff4655;
            margin-bottom: 8px;
            display: block;
        }
        .login-box h1 {
            font-size: 38px;
            font-weight: 900;
            color: #0f1923;
            background: linear-gradient(135deg, #0f1923 40%, #ff4655 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .login-box .subtitle {
            color: #5b6f82;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 32px;
        }
        .login-box .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            width: 100%;
            padding: 16px 0;
            background: #ffffff;
            border: 1.5px solid #dadce0;
            border-radius: 9999px;
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .login-box .google-btn:hover {
            background: #f8f9fa;
            border-color: #ff4655;
            transform: scale(1.02);
            box-shadow: 0 4px 24px rgba(255, 70, 85, 0.15);
        }
        .login-box .google-btn i {
            font-size: 22px;
            color: #4285f4;
        }
        .login-box .divider {
            margin: 28px 0 18px;
            border-top: 1px solid #e8eaed;
            position: relative;
        }
        .login-box .divider span {
            background: #fff;
            padding: 0 16px;
            position: relative;
            top: -11px;
            color: #5b6f82;
            font-size: 13px;
            font-weight: 500;
        }
        .login-box .footer-note {
            color: #5b6f82;
            font-size: 13px;
            margin-top: 18px;
        }
        .login-box .footer-note i {
            color: #ff4655;
            margin-right: 6px;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 25, 35, 0.95);
            color: #fff;
            padding: 16px 32px;
            border-radius: 9999px;
            border: 1px solid #2a3a4a;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.8);
            z-index: 999;
            display: none;
            animation: slideUp 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            max-width: 92%;
            text-align: center;
            backdrop-filter: blur(16px);
        }
        .toast.show {
            display: block;
        }
        .toast.success {
            border-color: #00d4aa;
        }
        .toast.error {
            border-color: #ff4655;
        }
        .toast.warning {
            border-color: #ffaa00;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
        }
        .page-container {
            display: none;
            animation: fadeIn 0.4s ease;
        }
        .page-container.active {
            display: block;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .loading-spinner {
            display: none;
            text-align: center;
            padding: 20px;
            color: #8899aa;
        }
        .loading-spinner i {
            font-size: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="container" id="appContainer">
        <!-- LOGIN -->
        <div id="loginSection" class="login-box">
            <span class="logo-icon"><i class="fas fa-crosshairs"></i></span>
            <h1>ValoTakas</h1>
            <p class="subtitle">Valorant Takas Platformu</p>
            <button id="loginBtn" class="google-btn">
                <i class="fab fa-google"></i> Google ile Giriş Yap
            </button>
            <div class="divider"><span>güvenli &amp; hızlı</span></div>
            <p class="footer-note"><i class="fas fa-shield-alt"></i> Firebase Authentication ile korunur</p>
        </div>

        <!-- SAYFA YÜKLEYİCİ -->
        <div id="pageLoader" class="loading-spinner">
            <i class="fas fa-spinner"></i> Yükleniyor...
        </div>

        <!-- SAYFALAR -->
        <div id="pageTakas" class="page-container"></div>
        <div id="pageTakasEkrani" class="page-container"></div>
        <div id="pageMenu" class="page-container"></div>
    </div>

    <div id="toast" class="toast"></div>

    <script type="module">
        // ================================================================
        // FIREBASE
        // ================================================================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-analytics.js";
        import {
            getAuth,
            signInWithPopup,
            GoogleAuthProvider,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
        import {
            getFirestore,
            doc,
            setDoc,
            getDoc,
            updateDoc,
            onSnapshot,
            collection,
            query,
            where,
            getDocs,
            deleteDoc
        } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCRIlZJQkQhAx87I9W4EdGrSsWPNYZF5zU",
            authDomain: "valotakasofficial.firebaseapp.com",
            projectId: "valotakasofficial",
            storageBucket: "valotakasofficial.firebasestorage.app",
            messagingSenderId: "1614560180",
            appId: "1:1614560180:web:d03a7d64c9b229a8a010e1",
            measurementId: "G-N09VJ4TZNE"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        const db = getFirestore(app);

        // ================================================================
        // STATE
        // ================================================================
        let currentUser = null;
        let currentTradeId = null;
        let unsubscribeTrade = null;
        let currentTradeData = null;
        let toastTimeout = null;
        let currentPage = 'takas';

        // ================================================================
        // DOM
        // ================================================================
        const loginSection = document.getElementById('loginSection');
        const loginBtn = document.getElementById('loginBtn');
        const pageLoader = document.getElementById('pageLoader');
        const pageTakas = document.getElementById('pageTakas');
        const pageTakasEkrani = document.getElementById('pageTakasEkrani');
        const pageMenu = document.getElementById('pageMenu');
        const toast = document.getElementById('toast');

        // ================================================================
        // HELPERS
        // ================================================================
        function showToast(message, type = 'success') {
            if (toastTimeout) { clearTimeout(toastTimeout);
                toast.classList.remove('show'); }
            const icon = type === 'error' ? '❌' : type === 'warning' ? '⚠️' : '✅';
            toast.innerHTML = `<span style="margin-right:8px;">${icon}</span> ${message}`;
            toast.className = `toast show ${type}`;
            toastTimeout = setTimeout(() => { toast.classList.remove('show');
                toastTimeout = null; }, 4500);
        }

        function showPage(pageName) {
            // Tüm sayfaları gizle
            document.querySelectorAll('.page-container').forEach(el => el.classList.remove('active'));
            pageLoader.style.display = 'none';

            if (pageName === 'takas') {
                pageTakas.classList.add('active');
                loadTakasPage();
            } else if (pageName === 'takasekrani') {
                pageTakasEkrani.classList.add('active');
                loadTakasEkraniPage();
            } else if (pageName === 'menu') {
                pageMenu.classList.add('active');
                loadMenuPage();
            }
            currentPage = pageName;
        }

        function showLoading() {
            document.querySelectorAll('.page-container').forEach(el => el.classList.remove('active'));
            pageLoader.style.display = 'block';
        }

        function getTradeLink(tradeId) {
            return `https://valotakasofficial.vercel.app/?tradeId=${tradeId}`;
        }

        function generateCode() {
            return String(Math.floor(100000 + Math.random() * 900000));
        }

        // ================================================================
        // SAYFA YÜKLEMELERİ
        // ================================================================

        // ---- takas.html ----
        async function loadTakasPage() {
            if (!currentUser) return;
            showLoading();
            try {
                const response = await fetch('takas.html');
                const html = await response.text();
                pageTakas.innerHTML = html;
                // Sayfa yüklendikten sonra event'leri bağla
                setTimeout(() => initTakasPage(), 50);
            } catch (e) {
                // Fallback: inline takas sayfası
                pageTakas.innerHTML = getInlineTakasPage();
                setTimeout(() => initTakasPage(), 50);
            }
        }

        // ---- takasekrani.html ----
        async function loadTakasEkraniPage() {
            if (!currentUser) return;
            showLoading();
            try {
                const response = await fetch('takasekrani.html');
                const html = await response.text();
                pageTakasEkrani.innerHTML = html;
                setTimeout(() => initTakasEkraniPage(), 50);
            } catch (e) {
                pageTakasEkrani.innerHTML = getInlineTakasEkraniPage();
                setTimeout(() => initTakasEkraniPage(), 50);
            }
        }

        // ---- menu.html ----
        async function loadMenuPage() {
            if (!currentUser) return;
            showLoading();
            try {
                const response = await fetch('menu.html');
                const html = await response.text();
                pageMenu.innerHTML = html;
                setTimeout(() => initMenuPage(), 50);
            } catch (e) {
                pageMenu.innerHTML = getInlineMenuPage();
                setTimeout(() => initMenuPage(), 50);
            }
        }

        // ================================================================
        // INLINE FALLBACK SAYFALARI
        // ================================================================

                        <button id="confirmTradeBtn" style="background:linear-gradient(135deg,#ff4655,#cc3344);border:none;color:#fff;font-weight:700;padding:15px;border-radius:9999px;cursor:pointer;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 20px rgba(255,70,85,0.25);">
                            <i class="fas fa-check-circle"></i> Takas Oluştur

                        <button id="cancelTradeBtn" style="background:transparent;border:1px solid #2a3a4a;color:#8899aa;padding:12px;border-radius:9999px;cursor:pointer;font-weight:600;font-size:13px;margin-top:2px;">İptal</button>
                    </div>
                    <div id="linkBox" style="display:none;background:linear-gradient(135deg,#0f1923,#141e28);padding:18px 20px;border-radius:16px;margin-top:14px;border:1px solid #2a3a4a;flex-direction:column;gap:12px;">
                        <div style="display:flex;justify-content:space-between;align-items:center;">
                            <span style="font-size:12px;font-weight:700;color:#8899aa;text-transform:uppercase;letter-spacing:0.8px;"><i class="fas fa-link"></i> Takas Linkin</span>
                            <div style="display:flex;gap:8px;">
                                <button id="copyLinkBtn" style="background:transparent;border:1px solid #00d4aa;color:#00d4aa;padding:6px 12px;border-radius:9999px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;"><i class="fas fa-copy"></i> Kopyala</button>
                                <button id="deleteLinkBtn" style="background:transparent;border:1px solid #ff4655;color:#ff4655;padding:6px 12px;border-radius:9999px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;"><i class="fas fa-trash"></i> İptal Et</button>
                            </div>

                            <button id="joinLinkBtn" style="background:linear-gradient(135deg,#ff4655,#cc3344);border:none;color:#fff;font-weight:700;padding:12px 24px;border-radius:9999px;cursor:pointer;white-space:nowrap;box-shadow:0 4px 16px rgba(255,70,85,0.25);">
                                <i class="fas fa-arrow-right"></i> Katıl

                    </div>
                    <div id="statusBox" style="display:none;background:linear-gradient(135deg,#0f1923,#141e28);border-radius:16px;padding:18px 20px;margin-top:16px;border-left:4px solid #ff4655;border:1px solid #2a3a4a;border-left-width:4px;">

                    </div>
                    <div id="codeSection" style="display:none;margin-top:18px;">

                            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                                <span style="font-weight:600;color:#b0c0d0;font-size:14px;display:flex;align-items:center;gap:8px;"><i class="fas fa-qrcode"></i> Kod Doğrulama</span>

        function getInlineTakasEkraniPage() {

                    </div>

                    .avatar.waiting { border-color: #ffaa00 !important; box-shadow: 0 0 24px rgba(255,170,0,0.2); }
                    .status-text.ready { color: #00d4aa !important; }
                    .status-text.waiting { color: #ffaa00 !important; }

        function getInlineMenuPage() {
            return `
                <div>
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">

                        </button>

                    <div id="tradeListContainer" style="display:flex;flex-direction:column;gap:12px;max-height:320px;overflow-y:auto;padding-right:4px;">

                            <i class="fas fa-inbox" style="font-size:28px;display:block;margin-bottom:8px;"></i>
                            Henüz takasın yok.
                        </div>

                <style>
                    #tradeListContainer::-webkit-scrollbar { width: 4px; }
                    #tradeListContainer::-webkit-scrollbar-track { background: #0f1923; border-radius: 4px; }

                    .trade-item:hover { border-color: #3a4a5a; transform: translateX(4px); }
                    .trade-item .info .title { font-weight: 600; font-size: 14px; color: #fff; }
                    .trade-item .info .sub { font-size: 12px; color: #8899aa; }
                    .trade-item .status-badge { font-size: 10px; font-weight: 700; padding: 3px 12px; border-radius: 9999px; text-transform: uppercase; letter-spacing: 0.5px; }
                    .trade-item .status-badge.waiting { background: rgba(255,170,0,0.15); color: #ffaa00; }
                    .trade-item .status-badge.active { background: rgba(0,212,170,0.15); color: #00d4aa; }
                    .trade-item .status-badge.completed { background: rgba(0,212,170,0.2); color: #00d4aa; }

                    .trade-item .delete-btn:hover { color: #ff4655; background: rgba(255,70,85,0.1); transform: scale(1.1); }

        // ================================================================
        // TAKAS SAYFASI EVENT'LERİ
        // ================================================================
        function initTakasPage() {
            const openTradeBtn = document.getElementById('openTradeBtn');
            const tradeForm = document.getElementById('tradeForm');
            const tradeUsername = document.getElementById('tradeUsername');
            const tradePassword = document.getElementById('tradePassword');
            const confirmTradeBtn = document.getElementById('confirmTradeBtn');
            const cancelTradeBtn = document.getElementById('cancelTradeBtn');
            const linkBox = document.getElementById('linkBox');
            const tradeLinkInput = document.getElementById('tradeLinkInput');
            const copyLinkBtn = document.getElementById('copyLinkBtn');
            const copyLinkBtnSmall = document.getElementById('copyLinkBtnSmall');
            const deleteLinkBtn = document.getElementById('deleteLinkBtn');
            const manualLinkInput = document.getElementById('manualLinkInput');
            const joinLinkBtn = document.getElementById('joinLinkBtn');
            const statusBox = document.getElementById('statusBox');
            const statusDesc = document.getElementById('statusDesc');
            const codeSection = document.getElementById('codeSection');
            const myCodeDisplay = document.getElementById('myCodeDisplay');
            const codeInput = document.getElementById('codeInput');
            const confirmCodeBtn = document.getElementById('confirmCodeBtn');
            const partnerCodeBox = document.getElementById('partnerCodeBox');
            const partnerCodeDisplay = document.getElementById('partnerCodeDisplay');
            const codeStatus = document.getElementById('codeStatus');

            // Takas oluştur
            async function createTrade(username, password) {
                if (!currentUser) { showToast('Önce giriş yapın!', 'error'); return false; }
                if (currentTradeId) { showToast('Zaten aktif bir takasınız var.', 'warning'); return false; }
                try {
                    const tradeData = {
                        creatorId: currentUser.uid,
                        creatorUsername: username,
                        creatorPassword: password,
                        creatorCode: generateCode(),
                        creatorConfirmed: false,
                        partnerId: null,
                        partnerUsername: '',
                        partnerPassword: '',
                        partnerCode: '',
                        partnerConfirmed: false,
                        status: 'waiting_partner',
                        createdAt: new Date().toISOString()
                    };
                    const docRef = doc(collection(db, "trades"));
                    await setDoc(docRef, tradeData);
                    currentTradeId = docRef.id;
                    currentTradeData = tradeData;
                    showToast('✅ Takas oluşturuldu!', 'success');
                    await listenForTrade(currentUser.uid);
                    loadMenuPage();
                    return true;
                } catch (error) {
                    console.error('Create trade error:', error);
                    showToast('Takas oluşturulamadı: ' + error.message, 'error');
                    return false;
                }
            }

            // Takas UI güncelle
            function setupTradeUI(tradeId, data, userId) {
                currentTradeId = tradeId;
                currentTradeData = data;
                if (tradeForm) tradeForm.style.display = 'none';
                if (linkBox) linkBox.style.display = 'none';
                if (statusBox) statusBox.style.display = 'none';
                if (codeSection) codeSection.style.display = 'none';
                if (partnerCodeBox) partnerCodeBox.style.display = 'none';

                if (data.status === 'waiting_partner' && data.creatorId === userId) {
                    const link = getTradeLink(tradeId);
                    if (tradeLinkInput) tradeLinkInput.value = link;
                    if (linkBox) linkBox.style.display = 'flex';
                    if (statusBox) { statusBox.style.display = 'block';
                        statusDesc.textContent = 'Takas linki oluşturuldu. Karşı tarafın katılmasını bekleyin.'; }
                    console.log('✅ Link:', link);
                    return;
                }

                if (data.status === 'waiting_codes') {
                    if (codeSection) codeSection.style.display = 'block';
                    if (statusBox) { statusBox.style.display = 'block';
                        statusDesc.textContent = 'Kod doğrulama aşaması.'; }

                    if (data.creatorId === userId) {
                        if (myCodeDisplay) myCodeDisplay.textContent = data.creatorCode || '------';
                        if (data.partnerCode) {
                            if (partnerCodeDisplay) partnerCodeDisplay.textContent = data.partnerCode;
                            if (partnerCodeBox) partnerCodeBox.style.display = 'block';
                            if (codeStatus) { codeStatus.textContent = 'PARTNER KODU GELDİ';
                                codeStatus.style.background = 'rgba(0,212,170,0.15)';
                                codeStatus.style.color = '#00d4aa'; }
                        } else {
                            if (partnerCodeBox) partnerCodeBox.style.display = 'none';
                            if (codeStatus) { codeStatus.textContent = 'PARTNER BEKLENİYOR';
                                codeStatus.style.background = 'rgba(255,170,0,0.15)';
                                codeStatus.style.color = '#ffaa00'; }
                        }
                    } else if (data.partnerId === userId) {
                        if (myCodeDisplay) myCodeDisplay.textContent = data.partnerCode || '------';
                        if (data.creatorCode) {
                            if (partnerCodeDisplay) partnerCodeDisplay.textContent = data.creatorCode;
                            if (partnerCodeBox) partnerCodeBox.style.display = 'block';
                            if (codeStatus) { codeStatus.textContent = 'KARŞI TARAF KODU GELDİ';
                                codeStatus.style.background = 'rgba(0,212,170,0.15)';
                                codeStatus.style.color = '#00d4aa'; }
                        } else {
                            if (partnerCodeBox) partnerCodeBox.style.display = 'none';
                            if (codeStatus) { codeStatus.textContent = 'KARŞI TARAF BEKLENİYOR';
                                codeStatus.style.background = 'rgba(255,170,0,0.15)';
                                codeStatus.style.color = '#ffaa00'; }
                        }
                    }
                    // Takas ekranına git
                    showPage('takasekrani');
                    return;
                }

                if (data.status === 'completed') {
                    showToast('🎉 Takas başarıyla tamamlandı!', 'success');
                    resetUI();
                    return;
                }
                if (data.status === 'cancelled') {
                    showToast('Takas iptal edildi.', 'warning');
                    resetUI();
                    return;
                }
            }

            // Takas dinle
            async function listenForTrade(userId) {
                if (unsubscribeTrade) { unsubscribeTrade();
                    unsubscribeTrade = null; }
                try {
                    const qCreator = query(collection(db, "trades"),
                        where("creatorId", "==", userId),
                        where("status", "in", ["waiting_partner", "waiting_codes"])
                    );
                    const snapCreator = await getDocs(qCreator);
                    if (!snapCreator.empty) {
                        const docSnap = snapCreator.docs[0];
                        currentTradeId = docSnap.id;
                        currentTradeData = docSnap.data();
                        setupTradeUI(docSnap.id, docSnap.data(), userId);
                        unsubscribeTrade = onSnapshot(doc(db, "trades", currentTradeId), (doc) => {
                            if (doc.exists()) {
                                currentTradeData = doc.data();
                                setupTradeUI(doc.id, doc.data(), userId);
                            } else {
                                resetUI();
                                showToast('Takas sonlandırıldı.', 'warning');
                            }
                        });
                        return;
                    }
                    const qPartner = query(collection(db, "trades"),
                        where("partnerId", "==", userId),
                        where("status", "in", ["waiting_codes"])
                    );
                    const snapPartner = await getDocs(qPartner);
                    if (!snapPartner.empty) {
                        const docSnap = snapPartner.docs[0];
                        currentTradeId = docSnap.id;
                        currentTradeData = docSnap.data();
                        setupTradeUI(docSnap.id, docSnap.data(), userId);
                        unsubscribeTrade = onSnapshot(doc(db, "trades", currentTradeId), (doc) => {
                            if (doc.exists()) {
                                currentTradeData = doc.data();
                                setupTradeUI(doc.id, doc.data(), userId);
                            } else {
                                resetUI();
                                showToast('Takas sonlandırıldı.', 'warning');
                            }
                        });
                        return;
                    }
                    resetUI();
                } catch (error) {
                    console.error('ListenForTrade error:', error);
                    showToast('Takas durumu alınamadı: ' + error.message, 'error');
                }
            }

            function resetUI() {
                if (tradeForm) tradeForm.style.display = 'none';
                if (linkBox) linkBox.style.display = 'none';
                if (statusBox) statusBox.style.display = 'none';
                if (codeSection) codeSection.style.display = 'none';
                if (partnerCodeBox) partnerCodeBox.style.display = 'none';
                currentTradeId = null;
                currentTradeData = null;
                if (unsubscribeTrade) {
                    unsubscribeTrade();
                    unsubscribeTrade = null;
                }
                // localStorage temizle
                localStorage.removeItem('valotakas_trade');
            }

            // Kod doğrula
            async function verifyCode(code) {
                if (!currentTradeId || !currentUser) { showToast('Aktif takas bulunamadı.', 'error'); return; }
                if (!code || code.length !== 6 || isNaN(code)) { showToast('Lütfen 6 haneli sayısal kodu girin.', 'error'); return; }
                try {
                    const docRef = doc(db, "trades", currentTradeId);
                    const docSnap = await getDoc(docRef);
                    if (!docSnap.exists()) { showToast('Takas bulunamadı.', 'error'); return; }
                    const data = docSnap.data();

                    if (data.creatorId === currentUser.uid) {
                        if (data.creatorCode !== code) { showToast('❌ Yanlış kod!', 'error'); return; }
                        await updateDoc(docRef, { creatorConfirmed: true, updatedAt: new Date().toISOString() });
                        showToast('✅ Kod doğrulandı! Karşı taraf bekleniyor.', 'success');
                    } else if (data.partnerId === currentUser.uid) {
                        if (data.partnerCode !== code) { showToast('❌ Yanlış kod!', 'error'); return; }
                        await updateDoc(docRef, { partnerConfirmed: true, updatedAt: new Date().toISOString() });
                        showToast('✅ Kod doğrulandı! Karşı taraf bekleniyor.', 'success');
                    } else {
                        showToast('Bu takasa ait değilsiniz.', 'error');
                        return;
                    }

                    const updated = (await getDoc(docRef)).data();
                    if (updated.creatorConfirmed && updated.partnerConfirmed) {
                        await updateDoc(docRef, { status: 'completed', updatedAt: new Date().toISOString() });
                        showToast('🎉 Takas başarıyla tamamlandı!', 'success');
                        if (updated.creatorId === currentUser.uid) {
                            showToast('Partner kodunuz: ' + updated.partnerCode, 'success');
                        } else {
                            showToast('Partner kodunuz: ' + updated.creatorCode, 'success');
                        }
                        resetUI();
                        await listenForTrade(currentUser.uid);
                        loadMenuPage();
                    }
                } catch (error) {
                    console.error('Verify code error:', error);
                    showToast('Doğrulama hatası: ' + error.message, 'error');
                }
            }

            // Event'leri bağla
            if (openTradeBtn) {
                openTradeBtn.addEventListener('click', () => {
                    if (!currentUser) { showToast('Önce giriş yapın!', 'error'); return; }
                    if (tradeForm) {
                        const isActive = tradeForm.style.display === 'flex';
                        tradeForm.style.display = isActive ? 'none' : 'flex';
                        if (!isActive) {
                            if (tradeUsername) tradeUsername.value = '';
                            if (tradePassword) tradePassword.value = '';
                            if (tradeUsername) tradeUsername.focus();
                        }
                    }
                });
            }

            if (confirmTradeBtn) {
                confirmTradeBtn.addEventListener('click', async () => {
                    const username = tradeUsername ? tradeUsername.value.trim() : '';
                    const password = tradePassword ? tradePassword.value.trim() : '';
                    if (!username || !password) {
                        showToast('Lütfen Valorant kullanıcı adı ve şifrenizi girin.', 'error');
                        return;
                    }
                    await createTrade(username, password);
                    if (tradeForm) tradeForm.style.display = 'none';
                });
            }

            if (cancelTradeBtn) {
                cancelTradeBtn.addEventListener('click', () => {
                    if (tradeForm) tradeForm.style.display = 'none';
                });
            }

            // Kopyala
            async function copyLinkFn() {
                const link = tradeLinkInput ? tradeLinkInput.value : '';
                if (!link || link === 'Link oluşturuluyor...') {
                    showToast('Önce takas oluşturun!', 'error');
                    return;
                }
                try {
                    await navigator.clipboard.writeText(link);
                    const btns = [copyLinkBtn, copyLinkBtnSmall];
                    btns.forEach(btn => {
                        if (btn) { btn.innerHTML = '<i class="fas fa-check"></i> Kopyalandı!';
                            btn.style.background = '#00d4aa'; }
                    });
                    showToast('✅ Link kopyalandı!', 'success');
                    setTimeout(() => {
                        btns.forEach(btn => {
                            if (btn) { btn.innerHTML = '<i class="fas fa-copy"></i> Kopyala';
                                btn.style.background = ''; }
                        });
                    }, 3000);
                } catch {
                    if (tradeLinkInput) { tradeLinkInput.select();
                        document.execCommand('copy'); }
                    showToast('✅ Link kopyalandı!', 'success');
                }
            }

            if (copyLinkBtn) copyLinkBtn.addEventListener('click', copyLinkFn);
            if (copyLinkBtnSmall) copyLinkBtnSmall.addEventListener('click', copyLinkFn);

            // İptal
            if (deleteLinkBtn) {
                deleteLinkBtn.addEventListener('click', async () => {
                    if (!currentTradeId || !currentUser) {
                        showToast('Aktif takas bulunamadı.', 'warning');
                        return;
                    }
                    if (!confirm('Bu takası iptal etmek istediğinize emin misiniz?')) return;
                    try {
                        const docRef = doc(db, "trades", currentTradeId);
                        await updateDoc(docRef, { status: 'cancelled', updatedAt: new Date().toISOString() });
                        showToast('Takas iptal edildi.', 'warning');
                        resetUI();
                        await listenForTrade(currentUser.uid);
                        loadMenuPage();
                    } catch (error) {
                        console.error('Cancel trade error:', error);
                        showToast('İptal başarısız: ' + error.message, 'error');
                    }
                });
            }

            // Manuel Link ile Katıl
            if (joinLinkBtn) {
                joinLinkBtn.addEventListener('click', async () => {
                    const link = manualLinkInput ? manualLinkInput.value.trim() : '';
                    if (!link) { showToast('Lütfen bir link girin.', 'warning'); return; }

                    let tradeId = null;
                    try {
                        const url = new URL(link);
                        tradeId = url.searchParams.get('tradeId');
                    } catch {
                        const match = link.match(/[?&]tradeId=([^&]+)/);
                        if (match) tradeId = match[1];
                    }

                    if (!tradeId) { showToast('Geçersiz link!', 'error'); return; }

                    if (currentTradeId) {
                        if (currentTradeId === tradeId) { showToast('Zaten bu takasın içindesiniz.', 'warning'); return; }
                        resetUI();
                    }

                    try {
                        const docRef = doc(db, "trades", tradeId);
                        const docSnap = await getDoc(docRef);
                        if (!docSnap.exists()) { showToast('Takas bulunamadı.', 'error'); return; }
                        const data = docSnap.data();

                        if (data.creatorId === currentUser.uid) {
                            showToast('Bu takas size ait.', 'warning');
                            await listenForTrade(currentUser.uid);
                            return;
                        }

                        if (data.partnerId) {
                            if (data.partnerId === currentUser.uid) {
                                currentTradeId = tradeId;
                                currentTradeData = data;
                                setupTradeUI(tradeId, data, currentUser.uid);
                                return;
                            } else {
                                showToast('Bu takasa zaten bir partner katılmış.', 'error');
                                return;
                            }
                        }

                        if (data.status !== 'waiting_partner') {
                            showToast('Bu takas artık geçerli değil.', 'error');
                            return;
                        }

                        currentTradeId = tradeId;
                        currentTradeData = data;
                        // Takas ekranını göster
                        if (manualLinkInput) manualLinkInput.value = '';
                        showPage('takasekrani');
                        // Takas ekranını güncelle
                        setTimeout(() => {
                            if (typeof window.initTakasEkrani === 'function') {
                                window.initTakasEkrani(currentTradeId, data);
                            }
                        }, 100);

                    } catch (error) {
                        console.error('Join by link error:', error);
                        showToast('Katılım başarısız: ' + error.message, 'error');
                    }
                });
            }

            // Kod doğrulama
            if (confirmCodeBtn) {
                confirmCodeBtn.addEventListener('click', async () => {
                    const code = codeInput ? codeInput.value.trim() : '';
                    await verifyCode(code);
                    if (codeInput) codeInput.value = '';
                });
            }

            if (codeInput) {
                codeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && confirmCodeBtn) confirmCodeBtn
                    .click(); });
                codeInput.addEventListener('input', (e) => {
                    e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 6);
                });
            }

            // Başlangıçta aktif trade varsa göster
            if (currentTradeId && currentTradeData) {
                setupTradeUI(currentTradeId, currentTradeData, currentUser.uid);
            } else if (currentUser) {
                listenForTrade(currentUser.uid);
            }
        }

        // ================================================================
        // TAKAS EKRANI SAYFASI EVENT'LERİ
        // ================================================================
        function initTakasEkraniPage() {
            const screenMyPhoto = document.getElementById('screenMyPhoto');
            const screenMyName = document.getElementById('screenMyName');
            const screenMyStatus = document.getElementById('screenMyStatus');
            const screenPartnerPhoto = document.getElementById('screenPartnerPhoto');
            const screenPartnerName = document.getElementById('screenPartnerName');
            const screenPartnerStatus = document.getElementById('screenPartnerStatus');
            const partnerFormContainer = document.getElementById('partnerFormContainer');
            const partnerUsername = document.getElementById('partnerUsername');
            const partnerPassword = document.getElementById('partnerPassword');
            const joinTradeBtn = document.getElementById('joinTradeBtn');
            const partnerCodeSection = document.getElementById('partnerCodeSection');
            const partnerMyCode = document.getElementById('partnerMyCode');
            const partnerCodeInput = document.getElementById('partnerCodeInput');
            const partnerConfirmCodeBtn = document.getElementById('partnerConfirmCodeBtn');
            const partnerPartnerCodeBox = document.getElementById('partnerPartnerCodeBox');
            const partnerPartnerCode = document.getElementById('partnerPartnerCode');
            const partnerCodeStatus = document.getElementById('partnerCodeStatus');

            // Takas ekranını güncelle
            window.initTakasEkrani = function(tradeId, data) {
                if (!data) {
                    // Mevcut trade'den al
                    if (currentTradeData) data = currentTradeData;
                    else return;
                }

                if (screenMyPhoto) screenMyPhoto.src = currentUser?.photoURL || 'https://ui-avatars.com/api/?name=Ben&background=ff4655&color=fff&size=64';
                if (screenMyName) screenMyName.textContent = currentUser?.displayName || 'Ben';

                const partnerId = data.creatorId === currentUser?.uid ? data.partnerId : data.creatorId;
                const partnerName = data.creatorId === currentUser?.uid ? data.partnerUsername : data.creatorUsername;

                if (partnerId) {
                    // Partner katılmış
                    if (screenPartnerPhoto) screenPartnerPhoto.src = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(
                        partnerName || 'Partner') + '&background=ff4655&color=fff&size=64';
                    if (screenPartnerName) screenPartnerName.textContent = partnerName || 'Partner';

                    const isPartnerReady = data.creatorId === currentUser?.uid ? data.partnerConfirmed : data
                    .creatorConfirmed;
                    const isMeReady = data.creatorId === currentUser?.uid ? data.creatorConfirmed : data.partnerConfirmed;

                    if (screenPartnerStatus) {
                        screenPartnerStatus.textContent = isPartnerReady ? 'Hazır' : 'Bekleniyor';
                        screenPartnerStatus.className = isPartnerReady ? 'status-text ready' : 'status-text waiting';
                    }
                    if (screenPartnerPhoto) {
                        screenPartnerPhoto.className = isPartnerReady ? 'avatar ready' : 'avatar waiting';
                    }
                    if (screenMyStatus) {
                        screenMyStatus.textContent = isMeReady ? 'Hazır' : 'Hazır değil';
                        screenMyStatus.className = isMeReady ? 'status-text ready' : 'status-text waiting';
                    }
                    if (screenMyPhoto) {
                        screenMyPhoto.className = isMeReady ? 'avatar ready' : 'avatar waiting';
                    }

                    if (partnerFormContainer) partnerFormContainer.style.display = 'none';
                    if (partnerCodeSection) partnerCodeSection.style.display = 'block';

                    if (data.creatorId === currentUser?.uid) {
                        if (partnerMyCode) partnerMyCode.textContent = data.creatorCode || '------';
                        if (data.partnerCode) {
                            if (partnerPartnerCode) partnerPartnerCode.textContent = data.partnerCode;
                            if (partnerPartnerCodeBox) partnerPartnerCodeBox.style.display = 'block';
                            if (partnerCodeStatus) {
                                partnerCodeStatus.textContent = 'PARTNER KODU GELDİ';
                                partnerCodeStatus.style.background = 'rgba(0,212,170,0.15)';
                                partnerCodeStatus.style.color = '#00d4aa';
                            }
                        } else {
                            if (partnerPartnerCodeBox) partnerPartnerCodeBox.style.display = 'none';
                            if (partnerCodeStatus) {
                                partnerCodeStatus.textContent = 'PARTNER BEKLENİYOR';
                                partnerCodeStatus.style.background = 'rgba(255,170,0,0.15)';
                                partnerCodeStatus.style.color = '#ffaa00';
                            }
                        }
                    } else {
                        if (partnerMyCode) partnerMyCode.textContent = data.partnerCode || '------';
                        if (data.creatorCode) {
                            if (partnerPartnerCode) partnerPartnerCode.textContent = data.creatorCode;
                            if (partnerPartnerCodeBox) partnerPartnerCodeBox.style.display = 'block';
                            if (partnerCodeStatus) {
                                partnerCodeStatus.textContent = 'KARŞI TARAF KODU GELDİ';
                                partnerCodeStatus.style.background = 'rgba(0,212,170,0.15)';
                                partnerCodeStatus.style.color = '#00d4aa';
                            }
                        } else {
                            if (partnerPartnerCodeBox) partnerPartnerCodeBox.style.display = 'none';
                            if (partnerCodeStatus) {
                                partnerCodeStatus.textContent = 'KARŞI TARAF BEKLENİYOR';
                                partnerCodeStatus.style.background = 'rgba(255,170,0,0.15)';
                                partnerCodeStatus.style.color = '#ffaa00';
                            }
                        }
                    }
                } else {
                    // Partner henüz katılmadı
                    if (screenPartnerPhoto) { screenPartnerPhoto.className = 'avatar waiting';
                        screenPartnerPhoto.src = 'https://ui-avatars.com/api/?name=Partner&background=ff4655&color=fff&size=64'; }
                    if (screenPartnerName) screenPartnerName.textContent = '???';
                    if (screenPartnerStatus) { screenPartnerStatus.textContent = 'Bekleniyor';
                        screenPartnerStatus.className = 'status-text waiting'; }
                    if (screenMyStatus) { screenMyStatus.textContent = 'Hazır';
                        screenMyStatus.className = 'status-text ready'; }
                    if (screenMyPhoto) screenMyPhoto.className = 'avatar ready';

                    if (partnerFormContainer) partnerFormContainer.style.display = 'block';
                    if (partnerCodeSection) partnerCodeSection.style.display = 'none';

                    // Partner form butonu
                    if (joinTradeBtn) {
                        joinTradeBtn.onclick = async () => {
                            const pUsername = partnerUsername ? partnerUsername.value.trim() : '';
                            const pPassword = partnerPassword ? partnerPassword.value.trim() : '';
                            if (!pUsername || !pPassword) {
                                showToast('Lütfen tüm alanları doldurun.', 'error');
                                return;
                            }
                            await joinTradeAsPartner(currentTradeId, pUsername, pPassword);
                        };
                    }
                }
            };

            // Partner katılma
            async function joinTradeAsPartner(tradeId, username, password) {
                if (!currentUser) { showToast('Önce giriş yapın!', 'error'); return false; }
                try {
                    const docRef = doc(db, "trades", tradeId);
                    const docSnap = await getDoc(docRef);
                    if (!docSnap.exists()) { showToast('Geçersiz takas linki.', 'error'); return false; }
                    const data = docSnap.data();
                    if (data.creatorId === currentUser.uid) { showToast('Bu takas size ait.', 'warning'); return false; }
                    if (data.partnerId) { showToast('Bu takasa zaten bir partner katılmış.', 'error'); return false; }
                    if (data.status !== 'waiting_partner') { showToast('Bu takas artık geçerli değil.', 'error'); return false; }
                    const partnerCode = generateCode();
                    await updateDoc(docRef, {
                        partnerId: currentUser.uid,
                        partnerUsername: username,
                        partnerPassword: password,
                        partnerCode: partnerCode,
                        status: 'waiting_codes',
                        updatedAt: new Date().toISOString()
                    });
                    showToast('✅ Partner bilgileri kaydedildi.', 'success');
                    await listenForTrade(currentUser.uid);
                    loadMenuPage();
                    return true;
                } catch (error) {
                    console.error('Join trade error:', error);
                    showToast('Katılım başarısız: ' + error.message, 'error');
                    return false;
                }
            }

            // Partner kod doğrula
            if (partnerConfirmCodeBtn) {
                partnerConfirmCodeBtn.addEventListener('click', async () => {
                    const code = partnerCodeInput ? partnerCodeInput.value.trim() : '';
                    if (!currentTradeId || !currentUser) { showToast('Aktif takas bulunamadı.', 'error'); return; }
                    if (!code || code.length !== 6 || isNaN(code)) { showToast('Lütfen 6 haneli sayısal kodu girin.',
                        'error'); return; }
                    try {
                        const docRef = doc(db, "trades", currentTradeId);
                        const docSnap = await getDoc(docRef);
                        if (!docSnap.exists()) { showToast('Takas bulunamadı.', 'error'); return; }
                        const data = docSnap.data();

                        if (data.creatorId === currentUser.uid) {
                            if (data.creatorCode !== code) { showToast('❌ Yanlış kod!', 'error'); return; }
                            await updateDoc(docRef, { creatorConfirmed: true, updatedAt: new Date().toISOString() });
                            showToast('✅ Kod doğrulandı! Karşı taraf bekleniyor.', 'success');
                            if (data.partnerCode && partnerPartnerCode) {
                                partnerPartnerCode.textContent = data.partnerCode;
                                if (partnerPartnerCodeBox) partnerPartnerCodeBox.style.display = 'block';
                                if (partnerCodeStatus) {
                                    partnerCodeStatus.textContent = 'PARTNER KODU GELDİ';
                                    partnerCodeStatus.style.background = 'rgba(0,212,170,0.15)';
                                    partnerCodeStatus.style.color = '#00d4aa';
                                }
                            }
                        } else if (data.partnerId === currentUser.uid) {
                            if (data.partnerCode !== code) { showToast('❌ Yanlış kod!', 'error'); return; }
                            await updateDoc(docRef, { partnerConfirmed: true, updatedAt: new Date().toISOString() });
                            showToast('✅ Kod doğrulandı! Karşı taraf bekleniyor.', 'success');
                            if (data.creatorCode && partnerPartnerCode) {
                                partnerPartnerCode.textContent = data.creatorCode;
                                if (partnerPartnerCodeBox) partnerPartnerCodeBox.style.display = 'block';
                                if (partnerCodeStatus) {
                                    partnerCodeStatus.textContent = 'KARŞI TARAF KODU GELDİ';
                                    partnerCodeStatus.style.background = 'rgba(0,212,170,0.15)';
                                    partnerCodeStatus.style.color = '#00d4aa';
                                }
                            }
                        }

                        const updated = (await getDoc(docRef)).data();
                        if (updated.creatorConfirmed && updated.partnerConfirmed) {
                            await updateDoc(docRef, { status: 'completed', updatedAt: new Date().toISOString() });
                            showToast('🎉 Takas başarıyla tamamlandı!', 'success');
                            if (updated.creatorId === currentUser.uid) {
                                showToast('Partner kodunuz: ' + updated.partnerCode, 'success');
                            } else {
                                showToast('Partner kodunuz: ' + updated.creatorCode, 'success');
                            }
                            resetUI();
                            await listenForTrade(currentUser.uid);
                            loadMenuPage();
                        }
                    } catch (error) {
                        console.error('Verify partner code error:', error);
                        showToast('Doğrulama hatası: ' + error.message, 'error');
                    }
                    if (partnerCodeInput) partnerCodeInput.value = '';
                });
            }

            if (partnerCodeInput) {
                partnerCodeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && partnerConfirmCodeBtn)
                        partnerConfirmCodeBtn.click(); });
                partnerCodeInput.addEventListener('input', (e) => {
                    e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 6);
                });
            }

            // Mevcut trade varsa göster
            if (currentTradeId && currentTradeData) {
                setTimeout(() => {
                    if (typeof window.initTakasEkrani === 'function') {
                        window.initTakasEkrani(currentTradeId, currentTradeData);
                    }
                }, 100);
            }
        }

        // ================================================================
        // MENU SAYFASI EVENT'LERİ
        // ================================================================
        function initMenuPage() {
            const tradeListContainer = document.getElementById('tradeListContainer');
            const refreshListBtn = document.getElementById('refreshListBtn');

            async function loadTradeList(userId) {
                try {
                    const q = query(collection(db, "trades"),
                        where("creatorId", "==", userId),
                        where("status", "in", ["waiting_partner", "waiting_codes", "completed"])
                    );
                    const snap = await getDocs(q);
                    if (snap.empty) {
                        if (tradeListContainer) {
                            tradeListContainer.innerHTML = `
                                <div style="text-align:center;color:#5b6f82;padding:30px 0;font-size:14px;">
                                    <i class="fas fa-inbox" style="font-size:28px;display:block;margin-bottom:8px;"></i>
                                    Henüz takasın yok.
                                </div>
                            `;
                        }
                        return;
                    }
                    let html = '';
                    snap.forEach(doc => {
                        const data = doc.data();
                        const statusMap = {
                            'waiting_partner': { label: 'Bekliyor', cls: 'waiting' },
                            'waiting_codes': { label: 'Aktif', cls: 'active' },
                            'completed': { label: 'Tamamlandı', cls: 'completed' }
                        };
                        const st = statusMap[data.status] || { label: data.status, cls: 'waiting' };
                        html += `
                            <div class="trade-item">
                                <div class="info">
                                    <div class="title">${data.creatorUsername || 'İsimsiz'}</div>
                                    <div class="sub">${data.partnerUsername ? 'Partner: ' + data.partnerUsername : 'Partner bekleniyor'}</div>
                                </div>
                                <div style="display:flex;align-items:center;gap:10px;">
                                    <span class="status-badge ${st.cls}">${st.label}</span>
                                    <button class="delete-btn" data-trade-id="${doc.id}"><i class="fas fa-trash"></i></button>
                                </div>
                            </div>
                        `;
                    });
                    if (tradeListContainer) tradeListContainer.innerHTML = html;

                    // Silme işlemleri
                    document.querySelectorAll('.delete-btn').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            const tradeId = btn.dataset.tradeId;
                            if (confirm('Bu takası silmek istediğinize emin misiniz?')) {
                                try {
                                    await deleteDoc(doc(db, "trades", tradeId));
                                    showToast('Takas silindi.', 'success');
                                    loadTradeList(userId);
                                } catch (e) {
                                    showToast('Silme hatası: ' + e.message, 'error');
                                }
                            }
                        });
                    });
                } catch (e) {
                    console.error('Load trade list error:', e);
                    showToast('Takas listesi yüklenemedi: ' + e.message, 'error');
                }
            }

            if (refreshListBtn) {
                refreshListBtn.addEventListener('click', () => {
                    if (currentUser) loadTradeList(currentUser.uid);
                });
            }

            if (currentUser) loadTradeList(currentUser.uid);
        }

        // ================================================================
        // GLOBAL FONKSİYONLAR
        // ================================================================

        async function listenForTrade(userId) {
            if (unsubscribeTrade) { unsubscribeTrade();
                unsubscribeTrade = null; }
            try {
                const qCreator = query(collection(db, "trades"),
                    where("creatorId", "==", userId),
                    where("status", "in", ["waiting_partner", "waiting_codes"])
                );
                const snapCreator = await getDocs(qCreator);
                if (!snapCreator.empty) {
                    const docSnap = snapCreator.docs[0];
                    currentTradeId = docSnap.id;
                    currentTradeData = docSnap.data();
                    // Takas sayfasını güncelle
                    if (currentPage === 'takas') {
                        // Takas sayfası init içinde setup yapılıyor
                    }
                    unsubscribeTrade = onSnapshot(doc(db, "trades", currentTradeId), (doc) => {
                        if (doc.exists()) {
                            currentTradeData = doc.data();
                            if (currentPage === 'takas') {
                                // Takas sayfasını güncelle
                            }
                            if (currentPage === 'takasekrani') {
                                if (typeof window.initTakasEkrani === 'function') {
                                    window.initTakasEkrani(currentTradeId, currentTradeData);
                                }
                            }
                            // Menu'yu güncelle
                            if (currentPage === 'menu') {
                                loadTradeList(currentUser.uid);
                            }
                        } else {
                            resetUI();
                            showToast('Takas sonlandırıldı.', 'warning');
                        }
                    });
                    return;
                }
                const qPartner = query(collection(db, "trades"),
                    where("partnerId", "==", userId),
                    where("status", "in", ["waiting_codes"])
                );
                const snapPartner = await getDocs(qPartner);
                if (!snapPartner.empty) {
                    const docSnap = snapPartner.docs[0];
                    currentTradeId = docSnap.id;
                    currentTradeData = docSnap.data();
                    unsubscribeTrade = onSnapshot(doc(db, "trades", currentTradeId), (doc) => {
                        if (doc.exists()) {
                            currentTradeData = doc.data();
                            if (currentPage === 'takas') {}
                            if (currentPage === 'takasekrani') {
                                if (typeof window.initTakasEkrani === 'function') {
                                    window.initTakasEkrani(currentTradeId, currentTradeData);
                                }
                            }
                            if (currentPage === 'menu') {
                                loadTradeList(currentUser.uid);
                            }
                        } else {
                            resetUI();
                            showToast('Takas sonlandırıldı.', 'warning');
                        }
                    });
                    return;
                }
                resetUI();
            } catch (error) {
                console.error('ListenForTrade error:', error);
                showToast('Takas durumu alınamadı: ' + error.message, 'error');
            }
        }

        function resetUI() {
            currentTradeId = null;
            currentTradeData = null;
            if (unsubscribeTrade) {
                unsubscribeTrade();
                unsubscribeTrade = null;
            }
            localStorage.removeItem('valotakas_trade');
        }

        // ================================================================
        // AUTH STATE
        // ================================================================
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                loginSection.style.display = 'none';
                // localStorage kontrol et
                const savedTrade = localStorage.getItem('valotakas_trade');
                if (savedTrade) {
                    try {
                        const parsed = JSON.parse(savedTrade);
                        currentTradeId = parsed.tradeId;
                        currentTradeData = parsed.data;
                    } catch {}
                }
                // Varsayılan sayfayı göster
                showPage('takas');
                // Aktif trade varsa dinle
                if (currentUser) {
                    await listenForTrade(currentUser.uid);
                }
                // URL'de tradeId varsa
                const params = new URLSearchParams(window.location.search);
                const urlTradeId = params.get('tradeId');
                if (urlTradeId && currentUser) {
                    // Manuel katılma işlemi
                    try {
                        const docRef = doc(db, "trades", urlTradeId);
                        const docSnap = await getDoc(docRef);
                        if (docSnap.exists()) {
                            const data = docSnap.data();
                            if (data.creatorId !== currentUser.uid && !data.partnerId) {
                                currentTradeId = urlTradeId;
                                currentTradeData = data;
                                showPage('takasekrani');
                                setTimeout(() => {
                                    if (typeof window.initTakasEkrani === 'function') {
                                        window.initTakasEkrani(urlTradeId, data);
                                    }
                                }, 100);
                            }
                        }
                    } catch {}
                }
            } else {
                currentUser = null;
                loginSection.style.display = 'block';
                document.querySelectorAll('.page-container').forEach(el => el.classList.remove('active'));
                pageLoader.style.display = 'none';
                resetUI();
            }
        });

        loginBtn.addEventListener('click', async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                showToast('Hoş geldin, ' + result.user.displayName + '!', 'success');
            } catch (error) {
                if (error.code === 'auth/popup-blocked') {
                    showToast('Popup engellendi! Lütfen popup engelini kaldırın.', 'error');
                } else if (error.code === 'auth/unauthorized-domain') {
                    showToast('Alan adı yetkili değil! Firebase konsoluna bu domaini ekleyin.', 'error');
                } else if (error.code !== 'auth/cancelled-popup-request') {
                    showToast('Giriş başarısız: ' + error.message, 'error');
                }
            }
        });

        console.log('🚀 ValoTakas v13.0 loaded');
    </script>
</body>
</html>
