<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ValoTakas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0f1923;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Inter', sans-serif;
        }
        .container {
            width: 100%;
            max-width: 620px;
            background: #1a2a3a;
            border-radius: 32px;
            padding: 36px 32px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 70, 85, 0.12);
        }
        .login-box {
            background: linear-gradient(145deg, #ffffff, #f5f7fa);
            border-radius: 24px;
            padding: 48px 40px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .login-box .logo-icon {
            font-size: 56px;
            color: #ff4655;
            margin-bottom: 8px;
            display: block;
        }
        .login-box h1 {
            font-size: 38px;
            font-weight: 900;
            color: #0f1923;
            background: linear-gradient(135deg, #0f1923 40%, #ff4655 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .login-box .subtitle {
            color: #5b6f82;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 32px;
        }
        .login-box .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            width: 100%;
            padding: 16px 0;
            background: #ffffff;
            border: 1.5px solid #dadce0;
            border-radius: 9999px;
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .login-box .google-btn:hover {
            background: #f8f9fa;
            border-color: #ff4655;
            transform: scale(1.02);
            box-shadow: 0 4px 24px rgba(255, 70, 85, 0.15);
        }
        .login-box .google-btn i {
            font-size: 22px;
            color: #4285f4;
        }
        .login-box .divider {
            margin: 28px 0 18px;
            border-top: 1px solid #e8eaed;
            position: relative;
        }
        .login-box .divider span {
            background: #fff;
            padding: 0 16px;
            position: relative;
            top: -11px;
            color: #5b6f82;
            font-size: 13px;
            font-weight: 500;
        }
        .login-box .footer-note {
            color: #5b6f82;
            font-size: 13px;
            margin-top: 18px;
        }
        .login-box .footer-note i {
            color: #ff4655;
            margin-right: 6px;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 25, 35, 0.95);
            color: #fff;
            padding: 16px 32px;
            border-radius: 9999px;
            border: 1px solid #2a3a4a;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.8);
            z-index: 999;
            display: none;
            animation: slideUp 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            max-width: 92%;
            text-align: center;
            backdrop-filter: blur(16px);
        }
        .toast.show {
            display: block;
        }
        .toast.success {
            border-color: #00d4aa;
        }
        .toast.error {
            border-color: #ff4655;
        }
        .toast.warning {
            border-color: #ffaa00;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
        }
        .page-container {
            display: none;
            animation: fadeIn 0.4s ease;
        }
        .page-container.active {
            display: block;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .loading-spinner {
            display: none;
            text-align: center;
            padding: 20px;
            color: #8899aa;
        }
        .loading-spinner i {
            font-size: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="container" id="appContainer">
        <!-- LOGIN -->
        <div id="loginSection" class="login-box">
            <span class="logo-icon"><i class="fas fa-crosshairs"></i></span>
            <h1>ValoTakas</h1>
            <p class="subtitle">Valorant Takas Platformu</p>
            <button id="loginBtn" class="google-btn">
                <i class="fab fa-google"></i> Google ile Giriş Yap
            </button>
            <div class="divider"><span>güvenli &amp; hızlı</span></div>
            <p class="footer-note"><i class="fas fa-shield-alt"></i> Firebase Authentication ile korunur</p>
        </div>

        <!-- SAYFA YÜKLEYİCİ -->
        <div id="pageLoader" class="loading-spinner">
            <i class="fas fa-spinner"></i> Yükleniyor...
        </div>

        <!-- SAYFALAR -->
        <div id="pageTakas" class="page-container"></div>
        <div id="pageTakasEkrani" class="page-container"></div>
        <div id="pageMenu" class="page-container"></div>
    </div>

    <div id="toast" class="toast"></div>

    <script type="module">
        // ================================================================
        // FIREBASE
        // ================================================================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-analytics.js";
        import {
            getAuth,
            signInWithPopup,
            GoogleAuthProvider,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
        import {
            getFirestore,
            doc,
            setDoc,
            getDoc,
            updateDoc,
            onSnapshot,
            collection,
            query,
            where,
            getDocs,
            deleteDoc
        } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCRIlZJQkQhAx87I9W4EdGrSsWPNYZF5zU",
            authDomain: "valotakasofficial.firebaseapp.com",
            projectId: "valotakasofficial",
            storageBucket: "valotakasofficial.firebasestorage.app",
            messagingSenderId: "1614560180",
            appId: "1:1614560180:web:d03a7d64c9b229a8a010e1",
            measurementId: "G-N09VJ4TZNE"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        const db = getFirestore(app);

        // ================================================================
        // STATE
        // ================================================================
        let currentUser = null;
        let currentTradeId = null;
        let unsubscribeTrade = null;
        let currentTradeData = null;
        let toastTimeout = null;
        let currentPage = 'takas';

        // ================================================================
        // DOM
        // ================================================================
        const loginSection = document.getElementById('loginSection');
        const loginBtn = document.getElementById('loginBtn');
        const pageLoader = document.getElementById('pageLoader');
        const pageTakas = document.getElementById('pageTakas');
        const pageTakasEkrani = document.getElementById('pageTakasEkrani');
        const pageMenu = document.getElementById('pageMenu');
        const toast = document.getElementById('toast');

        // ================================================================
        // HELPERS
        // ================================================================
        function showToast(message, type = 'success') {
            if (toastTimeout) { clearTimeout(toastTimeout);
                toast.classList.remove('show'); }
            const icon = type === 'error' ? '❌' : type === 'warning' ? '⚠️' : '✅';
            toast.innerHTML = `<span style="margin-right:8px;">${icon}</span> ${message}`;
            toast.className = `toast show ${type}`;
            toastTimeout = setTimeout(() => { toast.classList.remove('show');
                toastTimeout = null; }, 4500);
        }

        function showPage(pageName) {
            // Tüm sayfaları gizle
            document.querySelectorAll('.page-container').forEach(el => el.classList.remove('active'));
            pageLoader.style.display = 'none';

            if (pageName === 'takas') {
                pageTakas.classList.add('active');
                loadTakasPage();
            } else if (pageName === 'takasekrani') {
                pageTakasEkrani.classList.add('active');
                loadTakasEkraniPage();
            } else if (pageName === 'menu') {
                pageMenu.classList.add('active');
                loadMenuPage();
            }
            currentPage = pageName;
        }

        function showLoading() {
            document.querySelectorAll('.page-container').forEach(el => el.classList.remove('active'));
            pageLoader.style.display = 'block';
        }

        function getTradeLink(tradeId) {
            return `https://valotakasofficial.vercel.app/?tradeId=${tradeId}`;
        }

        function generateCode() {
            return String(Math.floor(100000 + Math.random() * 900000));
        }

        // ================================================================
        // SAYFA YÜKLEMELERİ
        // ================================================================

        // ---- takas.html ----
        async function loadTakasPage() {
            if (!currentUser) return;
            showLoading();
            try {
                const response = await fetch('takas.html');
                const html = await response.text();
                pageTakas.innerHTML = html;
                // Sayfa yüklendikten sonra event'leri bağla
                setTimeout(() => initTakasPage(), 50);
            } catch (e) {
                // Fallback: inline takas sayfası
                pageTakas.innerHTML = getInlineTakasPage();
                setTimeout(() => initTakasPage(), 50);
            }
        }

        // ---- takasekrani.html ----
        async function loadTakasEkraniPage() {
            if (!currentUser) return;
            showLoading();
            try {
                const response = await fetch('takasekrani.html');
                const html = await response.text();
                pageTakasEkrani.innerHTML = html;
                setTimeout(() => initTakasEkraniPage(), 50);
            } catch (e) {
                pageTakasEkrani.innerHTML = getInlineTakasEkraniPage();
                setTimeout(() => initTakasEkraniPage(), 50);
            }
        }

        // ---- menu.html ----
        async function loadMenuPage() {
            if (!currentUser) return;
            showLoading();
            try {
                const response = await fetch('menu.html');
                const html = await response.text();
                pageMenu.innerHTML = html;
                setTimeout(() => initMenuPage(), 50);
            } catch (e) {
                pageMenu.innerHTML = getInlineMenuPage();
                setTimeout(() => initMenuPage(), 50);
            }
        }

        // ================================================================
        // INLINE FALLBACK SAYFALARI
        // ================================================================

                        <button id="confirmTradeBtn" style="background:linear-gradient(135deg,#ff4655,#cc3344);border:none;color:#fff;font-weight:700;padding:15px;border-radius:9999px;cursor:pointer;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 20px rgba(255,70,85,0.25);">
                            <i class="fas fa-check-circle"></i> Takas Oluştur

                        <button id="cancelTradeBtn" style="background:transparent;border:1px solid #2a3a4a;color:#8899aa;padding:12px;border-radius:9999px;cursor:pointer;font-weight:600;font-size:13px;margin-top:2px;">İptal</button>
                    </div>
                    <div id="linkBox" style="display:none;background:linear-gradient(135deg,#0f1923,#141e28);padding:18px 20px;border-radius:16px;margin-top:14px;border:1px solid #2a3a4a;flex-direction:column;gap:12px;">
                        <div style="display:flex;justify-content:space-between;align-items:center;">
                            <span style="font-size:12px;font-weight:700;color:#8899aa;text-transform:uppercase;letter-spacing:0.8px;"><i class="fas fa-link"></i> Takas Linkin</span>
                            <div style="display:flex;gap:8px;">
                                <button id="copyLinkBtn" style="background:transparent;border:1px solid #00d4aa;color:#00d4aa;padding:6px 12px;border-radius:9999px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;"><i class="fas fa-copy"></i> Kopyala</button>
                                <button id="deleteLinkBtn" style="background:transparent;border:1px solid #ff4655;color:#ff4655;padding:6px 12px;border-radius:9999px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;"><i class="fas fa-trash"></i> İptal Et</button>
                            </div>

                            <button id="joinLinkBtn" style="background:linear-gradient(135deg,#ff4655,#cc3344);border:none;color:#fff;font-weight:700;padding:12px 24px;border-radius:9999px;cursor:pointer;white-space:nowrap;box-shadow:0 4px 16px rgba(255,70,85,0.25);">
                                <i class="fas fa-arrow-right"></i> Katıl

                    </div>
                    <div id="statusBox" style="display:none;background:linear-gradient(135deg,#0f1923,#141e28);border-radius:16px;padding:18px 20px;margin-top:16px;border-left:4px solid #ff4655;border:1px solid #2a3a4a;border-left-width:4px;">

                    </div>
                    <div id="codeSection" style="display:none;margin-top:18px;">

                            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                                <span style="font-weight:600;color:#b0c0d0;font-size:14px;display:flex;align-items:center;gap:8px;"><i class="fas fa-qrcode"></i> Kod Doğrulama</span>

        function getInlineTakasEkraniPage() {

                    </div>
